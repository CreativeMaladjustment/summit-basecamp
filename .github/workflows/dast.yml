name: DAST

# Dynamic scanning needs something running to point at, and this repository has
# no deployment yet. So the default target is built inside the job: the static
# PWA is served from the runner and scanned over localhost. Nothing outside the
# runner is touched unless DAST_TARGET_URL is configured.

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      target-url:
        description: URL to scan instead of the ephemeral local target
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: dast-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  ZAPROXY_IMAGE: ghcr.io/zaproxy/zaproxy:stable@sha256:781a2bdaea47324e7bab583e2263f21d257b0aee61ed51521a5be45f5f5081ef

jobs:
  detect:
    name: Detect static site
    runs-on: ubuntu-latest
    outputs:
      static-dir: ${{ steps.detect.outputs.static-dir }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: detect
        shell: bash
        env:
          # Set this repository variable if the site lives somewhere else.
          OVERRIDE: ${{ vars.DAST_STATIC_DIR }}
        run: |
          set -euo pipefail

          candidates="${OVERRIDE:-} web frontend frontend/public public dist site ."
          found=""
          for dir in $candidates; do
            if [ -f "$dir/index.html" ]; then
              found="$dir"
              break
            fi
          done

          echo "static-dir=$found" >> "$GITHUB_OUTPUT"
          if [ -n "$found" ]; then
            echo "Static site found at \`$found\` — it will be served and scanned." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No static site found (looked for an index.html) — local DAST skipped." >> "$GITHUB_STEP_SUMMARY"
          fi

  local-target:
    name: ZAP baseline (ephemeral local target)
    needs: detect
    if: needs.detect.outputs.static-dir != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare sanitized scan target
        id: target
        shell: bash
        env:
          STATIC_DIR: ${{ needs.detect.outputs.static-dir }}
        run: |
          set -euo pipefail
          site_dir="$(mktemp -d /tmp/dast-site.XXXXXX)"
          tar -C "$STATIC_DIR" --exclude='.git' -cf - . | tar -C "$site_dir" -xf -
          echo "site-dir=$site_dir" >> "$GITHUB_OUTPUT"

      - name: Serve the site
        shell: bash
        run: |
          set -euo pipefail
          nohup python3 -m http.server 8080 \
            --bind 127.0.0.1 \
            --directory '${{ steps.target.outputs.site-dir }}' \
            > /tmp/static-server.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS -o /dev/null http://127.0.0.1:8080/; then
              echo "target is up"
              exit 0
            fi
            sleep 1
          done
          echo "target never came up" >&2
          cat /tmp/static-server.log >&2
          exit 1

      - name: ZAP baseline scan
        id: zap
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p zap-out
          cp .zap/rules.tsv zap-out/rules.tsv
          chmod -R 777 zap-out

          docker run --rm --network host \
            -v "$PWD/zap-out:/zap/wrk/:rw" \
            "$ZAPROXY_IMAGE" \
            zap-baseline.py \
              -t http://127.0.0.1:8080 \
              -c rules.tsv \
              -r report.html \
              -J report.json \
              -w report.md \
              -a
          echo "exit-code=$?" >> "$GITHUB_OUTPUT"

      - name: Convert report to SARIF
        if: ${{ always() && hashFiles('zap-out/report.json') != '' }}
        shell: bash
        run: |
          python3 <<'PY'
          import json

          with open("zap-out/report.json", "r", encoding="utf-8") as fh:
              report = json.load(fh)

          level_map = {"0": "note", "1": "warning", "2": "error", "3": "error"}
          severity_map = {"0": "0.0", "1": "3.3", "2": "6.7", "3": "9.8"}
          rules = {}
          results = []

          for site in report.get("site", []):
              site_uri = site.get("@name", "")
              for alert in site.get("alerts", []):
                  rule_id = str(
                      alert.get("pluginid")
                      or alert.get("pluginId")
                      or alert.get("id")
                      or alert.get("name")
                      or "zap-alert"
                  )
                  rule_name = alert.get("name", rule_id)
                  risk_code = str(alert.get("riskcode") or alert.get("riskCode") or "0")
                  help_uri = ""
                  for candidate in str(alert.get("reference", "")).splitlines():
                      candidate = candidate.strip()
                      if candidate:
                          help_uri = candidate.split()[0]
                          break
                  if rule_id not in rules:
                      rule = {
                          "id": rule_id,
                          "name": rule_name,
                          "shortDescription": {"text": rule_name},
                          "fullDescription": {"text": alert.get("desc", rule_name)},
                          "help": {
                              "text": "\n\n".join(
                                  part for part in [alert.get("solution", ""), alert.get("otherinfo", "")] if part
                              )
                              or alert.get("desc", rule_name)
                          },
                          "properties": {"security-severity": severity_map.get(risk_code, "3.3")},
                      }
                      if help_uri:
                          rule["helpUri"] = help_uri
                      rules[rule_id] = rule

                  instances = alert.get("instances") or [{}]
                  for instance in instances:
                      location_uri = instance.get("uri") or site_uri
                      message_parts = [rule_name]
                      if instance.get("param"):
                          message_parts.append(f"Parameter: {instance['param']}")
                      if instance.get("evidence"):
                          message_parts.append(f"Evidence: {instance['evidence']}")
                      if alert.get("otherinfo"):
                          message_parts.append(str(alert["otherinfo"]))
                      result = {
                          "ruleId": rule_id,
                          "level": level_map.get(risk_code, "warning"),
                          "message": {"text": "\n".join(message_parts)},
                      }
                      if location_uri:
                          result["locations"] = [
                              {
                                  "physicalLocation": {
                                      "artifactLocation": {"uri": location_uri}
                                  }
                              }
                          ]
                      results.append(result)

          sarif = {
              "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
              "version": "2.1.0",
              "runs": [
                  {
                      "tool": {
                          "driver": {
                              "name": "OWASP ZAP",
                              "informationUri": "https://www.zaproxy.org/",
                              "rules": list(rules.values()),
                          }
                      },
                      "results": results,
                  }
              ],
          }

          with open("zap-out/report.sarif", "w", encoding="utf-8") as fh:
              json.dump(sarif, fh)
          PY

      - name: Upload SARIF
        if: ${{ always() && !github.event.pull_request.head.repo.fork && hashFiles('zap-out/report.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: zap-out/report.sarif
          category: zap-local-target

      - name: Report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f zap-out/report.md ]; then
            cat zap-out/report.md >> "$GITHUB_STEP_SUMMARY"
          fi

          # zap-baseline.py: 0 clean, 1 a FAIL rule tripped, 2 warnings only,
          # 3 the scan itself broke. A bare python http.server sends none of the
          # security headers that Cloudflare Pages will send, so warnings here
          # are noise rather than a defect in the change under review.
          case "${{ steps.zap.outputs.exit-code }}" in
            0) echo "No alerts." ;;
            2) echo "::warning::ZAP raised warnings against the local static target — see the job summary." ;;
            *) exit 1 ;;
          esac

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zap-local-target
          path: zap-out/
          retention-days: 14
          if-no-files-found: ignore

  deployed-target:
    name: ZAP baseline (deployed target)
    # Only runs once there is somewhere to point at: set the DAST_TARGET_URL
    # repository variable to a preview or staging URL, or pass one to a manual
    # run. This is a passive baseline scan, never an active attack, so it is
    # safe against a shared environment.
    if: ${{ vars.DAST_TARGET_URL != '' || inputs.target-url != '' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ZAP baseline scan
        id: zap
        shell: bash
        env:
          TARGET: ${{ inputs.target-url || vars.DAST_TARGET_URL }}
        run: |
          set -uo pipefail
          mkdir -p zap-out
          cp .zap/rules.tsv zap-out/rules.tsv
          chmod -R 777 zap-out

          docker run --rm \
            -v "$PWD/zap-out:/zap/wrk/:rw" \
            "$ZAPROXY_IMAGE" \
            zap-baseline.py \
              -t "$TARGET" \
              -c rules.tsv \
              -r report.html \
              -J report.json \
              -w report.md \
              -a
          echo "exit-code=$?" >> "$GITHUB_OUTPUT"

      - name: Convert report to SARIF
        if: ${{ always() && hashFiles('zap-out/report.json') != '' }}
        shell: bash
        run: |
          python3 <<'PY'
          import json

          with open("zap-out/report.json", "r", encoding="utf-8") as fh:
              report = json.load(fh)

          level_map = {"0": "note", "1": "warning", "2": "error", "3": "error"}
          severity_map = {"0": "0.0", "1": "3.3", "2": "6.7", "3": "9.8"}
          rules = {}
          results = []

          for site in report.get("site", []):
              site_uri = site.get("@name", "")
              for alert in site.get("alerts", []):
                  rule_id = str(
                      alert.get("pluginid")
                      or alert.get("pluginId")
                      or alert.get("id")
                      or alert.get("name")
                      or "zap-alert"
                  )
                  rule_name = alert.get("name", rule_id)
                  risk_code = str(alert.get("riskcode") or alert.get("riskCode") or "0")
                  help_uri = ""
                  for candidate in str(alert.get("reference", "")).splitlines():
                      candidate = candidate.strip()
                      if candidate:
                          help_uri = candidate.split()[0]
                          break
                  if rule_id not in rules:
                      rule = {
                          "id": rule_id,
                          "name": rule_name,
                          "shortDescription": {"text": rule_name},
                          "fullDescription": {"text": alert.get("desc", rule_name)},
                          "help": {
                              "text": "\n\n".join(
                                  part for part in [alert.get("solution", ""), alert.get("otherinfo", "")] if part
                              )
                              or alert.get("desc", rule_name)
                          },
                          "properties": {"security-severity": severity_map.get(risk_code, "3.3")},
                      }
                      if help_uri:
                          rule["helpUri"] = help_uri
                      rules[rule_id] = rule

                  instances = alert.get("instances") or [{}]
                  for instance in instances:
                      location_uri = instance.get("uri") or site_uri
                      message_parts = [rule_name]
                      if instance.get("param"):
                          message_parts.append(f"Parameter: {instance['param']}")
                      if instance.get("evidence"):
                          message_parts.append(f"Evidence: {instance['evidence']}")
                      if alert.get("otherinfo"):
                          message_parts.append(str(alert["otherinfo"]))
                      result = {
                          "ruleId": rule_id,
                          "level": level_map.get(risk_code, "warning"),
                          "message": {"text": "\n".join(message_parts)},
                      }
                      if location_uri:
                          result["locations"] = [
                              {
                                  "physicalLocation": {
                                      "artifactLocation": {"uri": location_uri}
                                  }
                              }
                          ]
                      results.append(result)

          sarif = {
              "$schema": "https://json.schemastore.org/sarif-2.1.0.json",
              "version": "2.1.0",
              "runs": [
                  {
                      "tool": {
                          "driver": {
                              "name": "OWASP ZAP",
                              "informationUri": "https://www.zaproxy.org/",
                              "rules": list(rules.values()),
                          }
                      },
                      "results": results,
                  }
              ],
          }

          with open("zap-out/report.sarif", "w", encoding="utf-8") as fh:
              json.dump(sarif, fh)
          PY

      - name: Upload SARIF
        if: ${{ always() && !github.event.pull_request.head.repo.fork && hashFiles('zap-out/report.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@1c5b675653bb5c22dbe9b12b556ec555138e09fd # v4.38.1
        with:
          sarif_file: zap-out/report.sarif
          category: zap-deployed-target

      - name: Report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ -f zap-out/report.md ]; then
            cat zap-out/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
          # A real deployment is expected to send its security headers, so
          # warnings fail here where they only warn against the local target.
          case "${{ steps.zap.outputs.exit-code }}" in
            0) echo "No alerts." ;;
            *) exit 1 ;;
          esac

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: zap-deployed-target
          path: zap-out/
          retention-days: 14
          if-no-files-found: ignore

  dast:
    name: DAST
    # Single stable check for branch protection, green when there is nothing
    # running to scan.
    needs: [detect, local-target, deployed-target]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Collect results
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          for result in \
            "detect=${{ needs.detect.result }}" \
            "local-target=${{ needs.local-target.result }}" \
            "deployed-target=${{ needs.deployed-target.result }}"
          do
            name="${result%%=*}"
            state="${result#*=}"
            echo "- $name: $state" >> "$GITHUB_STEP_SUMMARY"
            case "$state" in
              success|skipped) ;;
              *) fail=1 ;;
            esac
          done
          exit "$fail"

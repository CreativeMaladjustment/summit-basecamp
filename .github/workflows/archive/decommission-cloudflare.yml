name: Decommission old Cloudflare resources

# Deletes the pre-rebrand Worker (summit-hearth-api) or Pages project
# (summit-hearth-and-bench) once its replacement (see wrangler.jsonc /
# deploy.yml's CF_PAGES_PROJECT default) is confirmed working. Manual only,
# and requires typing the exact old resource name as confirmation -- this
# has no undo, unlike provision-cloudflare.yml's create-if-missing steps.
#
# Run this only after:
#   1. The new Worker/Pages project has actually deployed and been checked
#      (GET /api/health for the Worker; load the new Pages URL).
#   2. The CF_API_BASE_URL repository variable (read by
#      .github/workflows/sync-roster.yml) has been updated to the new
#      Worker's hostname. Deleting the old Worker before that breaks the
#      next scheduled sync with no visible error until it fails to run --
#      POST /api/admin/sync would be calling a Worker that no longer exists.
#
# Uses the Cloudflare API directly (not `wrangler delete`) so the exact
# outcome can be checked from the response's own "success" field rather
# than inferred from wrangler's exit code and console formatting.

on:
  workflow_dispatch:
    inputs:
      resource:
        description: What to delete
        required: true
        type: choice
        options: [worker, pages]
      confirm_name:
        description: >-
          Type the exact old resource name to confirm: summit-hearth-api for
          the Worker, summit-hearth-and-bench for the Pages project.
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: decommission-cloudflare
  cancel-in-progress: false

jobs:
  decommission:
    name: Delete the old resource
    runs-on: ubuntu-latest
    environment: sb
    steps:
      - name: Delete the old Worker
        if: inputs.resource == 'worker'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONFIRM_NAME: ${{ inputs.confirm_name }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM_NAME" != "summit-hearth-api" ]; then
            echo "::error::confirm_name must exactly match 'summit-hearth-api' to delete the Worker. Got '$CONFIRM_NAME' -- nothing deleted."
            exit 1
          fi

          response="$(curl -sS -X DELETE \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/scripts/summit-hearth-api" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")"
          echo "$response" | jq .
          if [ "$(echo "$response" | jq -r '.success')" != "true" ]; then
            echo "::error::Cloudflare API reported failure deleting the Worker -- see response above."
            exit 1
          fi
          echo "Deleted Worker summit-hearth-api."

      - name: Delete the old Pages project
        if: inputs.resource == 'pages'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CONFIRM_NAME: ${{ inputs.confirm_name }}
        run: |
          set -euo pipefail
          if [ "$CONFIRM_NAME" != "summit-hearth-and-bench" ]; then
            echo "::error::confirm_name must exactly match 'summit-hearth-and-bench' to delete the Pages project. Got '$CONFIRM_NAME' -- nothing deleted."
            exit 1
          fi

          response="$(curl -sS -X DELETE \
            "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/pages/projects/summit-hearth-and-bench" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")"
          echo "$response" | jq .
          if [ "$(echo "$response" | jq -r '.success')" != "true" ]; then
            echo "::error::Cloudflare API reported failure deleting the Pages project -- see response above."
            exit 1
          fi
          echo "Deleted Pages project summit-hearth-and-bench."

name: Diagnose denversummitfc.com markup

# Temporary, one-off: fetches Denver Summit's own site (schedule + roster
# pages) from a real GitHub Actions runner and prints a landmark search
# over the raw HTML, the same technique src/sync_sources.py's own
# SyncSourceError diagnostics use -- so we can see whether these pages are
# server-rendered (scrapeable) before writing a real parser against them.
# Deleted once that's answered; not meant to stay in the repo.

on:
  push:
    branches: [claude/keen-sagan-fh09u5]

permissions:
  contents: read

jobs:
  probe:
    name: Fetch and inspect
    runs-on: ubuntu-latest
    steps:
      - name: Fetch and report
        shell: python3 {0}
        run: |
          import re
          import urllib.error
          import urllib.request

          LANDMARKS = (
              "__NEXT_DATA__", "application/ld+json", "data-player-id",
              "jersey", "position", "match", "schedule", "opponent",
              "fixture", "kickoff", "vs.", " vs ", "roster",
          )

          # A bare "Mozilla/5.0" User-Agent got 403'd from a GitHub Actions
          # runner IP but worked from a laptop's residential IP -- trying a
          # fuller, real-browser header set here to tell "any non-browser
          # request gets blocked" apart from "datacenter IPs get blocked
          # regardless of headers".
          HEADERS = {
              "User-Agent": (
                  "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 "
                  "(KHTML, like Gecko) Chrome/129.0.0.0 Safari/537.36"
              ),
              "Accept": (
                  "text/html,application/xhtml+xml,application/xml;q=0.9,"
                  "image/avif,image/webp,*/*;q=0.8"
              ),
              "Accept-Language": "en-US,en;q=0.9",
          }

          def probe(url, article_marker=None):
              print("=" * 70)
              print(url)
              print("=" * 70)
              req = urllib.request.Request(url, headers=HEADERS)
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      status = resp.status
                      html = resp.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as error:
                  body = error.read().decode("utf-8", "replace")
                  print("FETCH FAILED:", repr(error))
                  print("Response headers:", dict(error.headers.items()))
                  print("Error body (first 1500 chars):")
                  print(re.sub(r"\s+", " ", body).strip()[:1500])
                  return
              except Exception as error:
                  print("FETCH FAILED:", repr(error))
                  return
              print("HTTP", status, "-", len(html), "bytes")

              # We already know these pages are server-rendered (previous
              # run). Now print full repeating item blocks so we can see
              # the actual structure to write a real parser against,
              # instead of just a landmark's surrounding context.
              if article_marker:
                  count = html.count(article_marker)
                  print("count of %r:" % article_marker, count)
                  first = html.find(article_marker)
                  second = html.find(article_marker, first + 1)
                  if first != -1 and second != -1:
                      block = html[first:second]
                      print("--- first full block (%d chars) ---" % len(block))
                      print(block)
                  elif first != -1:
                      print("--- only one match, next 4000 chars from it ---")
                      print(html[first:first + 4000])
                  else:
                      print("marker not found at all")
              print()

          probe("https://www.denversummitfc.com/schedule/", article_marker='<article class="schedule__match')

          # Roster page: we don't know the repeating player-card class yet.
          # Scan for likely WP-theme naming patterns and dump a window
          # around whichever shows up, past the header/nav boilerplate.
          ROSTER_CANDIDATES = (
              "roster__grid", "roster__list", "roster__card", "roster__item",
              "roster__player", "player-card", "player__card", "player__item",
              "team-member", "athlete-card", "jersey-number", "data-number",
              "wp-block-query", "wp-block-post-template", "headshot",
          )

          def probe_roster(url):
              print("=" * 70)
              print(url)
              print("=" * 70)
              req = urllib.request.Request(url, headers=HEADERS)
              with urllib.request.urlopen(req, timeout=30) as resp:
                  html = resp.read().decode("utf-8", "replace")
              print("HTTP", resp.status, "-", len(html), "bytes")
              for candidate in ROSTER_CANDIDATES:
                  idx = html.lower().find(candidate.lower())
                  if idx == -1:
                      continue
                  window = html[max(0, idx - 200):idx + 2500]
                  print("--- %r found at offset %d ---" % (candidate, idx))
                  print(window)
                  print()

          probe_roster("https://www.denversummitfc.com/roster/")

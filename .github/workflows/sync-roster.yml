name: Sync roster

# Runs the roster/fixture/opponent/headshot sync (src/sync.py) against the
# deployed Worker, by calling POST /api/admin/sync (src/handlers.trigger_sync)
# -- there is no Cloudflare-side cron for this any more (see the comment on
# "triggers" in wrangler.jsonc); it runs here so a run's logs and history
# live in GitHub Actions like everything else in this repo, rather than in
# the Worker's own cron log.
#
# Fires two ways:
#   - after every successful "Deploy" run on main, i.e. after a merge that
#     actually shipped -- a failed or cancelled deploy leaves the previous,
#     already-synced Worker in place, so there is nothing new to sync
#     against and this skips.
#   - on its own weekly schedule, so the roster/fixtures/headshots stay
#     current even on a week nothing in this repo changes. Mondays 5am UTC,
#     the same cadence the removed Cloudflare cron used to run this on.
#
# Needs two things set once, in the same "sb" GitHub environment deploy.yml
# uses:
#   - secret CF_SYNC_ADMIN_TOKEN: any random string, e.g. `openssl rand -hex
#     32`. deploy.yml's "Set SYNC_ADMIN_TOKEN secret" step pushes this same
#     value to the Worker as SYNC_ADMIN_TOKEN on every deploy -- nothing
#     else to do, just set the GitHub secret and let the next deploy run.
#   - variable CF_API_BASE_URL: the deployed Worker's base URL, e.g.
#     summit-basecamp-api.<your-subdomain>.workers.dev (the exact value is on
#     the Worker's Overview page in the Cloudflare dashboard), or a custom
#     domain if one is routed to it. The https:// scheme is optional -- the
#     "POST /api/admin/sync" step below fills it in when missing -- but
#     either way, no trailing slash. Update this after the Worker is renamed
#     (see wrangler.jsonc) -- the old hostname stays reachable, serving
#     whatever it last deployed, until the old Worker is deleted via
#     .github/workflows/archive/decommission-cloudflare.yml (move it back
#     into .github/workflows/ to run it -- GitHub Actions doesn't discover
#     workflows in subdirectories), so a stale value here fails silently
#     rather than loudly.

on:
  workflow_run:
    workflows: ["Deploy"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # One sync at a time; never cancel one already in flight -- a half-run
  # sync would otherwise leave the diff-and-write logic in sync.py part
  # applied.
  group: sync-roster
  cancel-in-progress: false

jobs:
  sync:
    name: Trigger roster sync
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'workflow_run'
      || github.event.workflow_run.conclusion == 'success'
    environment: sb
    steps:
      - name: Check required configuration
        shell: bash
        # Read through env rather than interpolating ${{ }} directly into
        # the script: a secret spliced straight into shell text can contain
        # characters (quotes, $(), a newline) that alter the script itself,
        # not just its value.
        env:
          API_BASE_URL: ${{ vars.CF_API_BASE_URL }}
          SYNC_ADMIN_TOKEN: ${{ secrets.CF_SYNC_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          missing=()
          [ -z "$API_BASE_URL" ] && missing+=("the CF_API_BASE_URL repository/environment variable")
          [ -z "$SYNC_ADMIN_TOKEN" ] && missing+=("the CF_SYNC_ADMIN_TOKEN secret")
          if [ "${#missing[@]}" -gt 0 ]; then
            printf '::error::Cannot trigger the roster sync -- missing: %s\n' "$(IFS=', '; echo "${missing[*]}")"
            exit 1
          fi

      - name: POST /api/admin/sync
        shell: bash
        env:
          API_BASE_URL: ${{ vars.CF_API_BASE_URL }}
          SYNC_ADMIN_TOKEN: ${{ secrets.CF_SYNC_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          # CF_API_BASE_URL may or may not include a scheme -- curl defaults
          # to plain http:// without one, which a *.workers.dev host (or
          # any Worker with "Always Use HTTPS" on) rejects or redirects
          # rather than serving, so this fills in https:// when missing
          # instead of relying on it always being set with a scheme.
          case "$API_BASE_URL" in
            http://*|https://*) base="$API_BASE_URL" ;;
            *) base="https://$API_BASE_URL" ;;
          esac

          status="$(curl -sS -o /tmp/sync-response.json -w '%{http_code}' \
            -X POST "${base%/}/api/admin/sync" \
            -H "Authorization: Bearer ${SYNC_ADMIN_TOKEN}")"

          {
            echo "### Roster sync (HTTP $status)"
            echo '```json'
            cat /tmp/sync-response.json
            echo
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$status" -ge 300 ]; then
            echo "::error::POST /api/admin/sync failed with status $status"
            cat /tmp/sync-response.json
            exit 1
          fi

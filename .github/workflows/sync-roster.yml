name: Sync roster

# Runs the roster/fixture/opponent/headshot sync (src/sync.py) straight from
# this runner (scripts/run_sync.py), writing to production D1 over
# Cloudflare's HTTP API instead of through the deployed Worker -- there is no
# Cloudflare-side cron for this either (see the comment on "triggers" in
# wrangler.jsonc), so a run's logs and history live in GitHub Actions like
# everything else in this repo, rather than in the Worker's own cron log.
#
# Moved off the Worker (previously POST /api/admin/sync) because a Cloudflare
# Worker's own fetch() to an external site like nwslsoccer.com originates
# from Cloudflare's edge IP space -- one of the most commonly
# bot-fingerprinted network ranges on the internet -- so a scrape that fails
# from inside the Worker may simply succeed from here, a GitHub-hosted runner
# on an unrelated network. See scripts/run_sync.py's own docstring for the
# rest of how that works.
#
# Fires two ways:
#   - after every successful "Deploy" run on main, i.e. after a merge that
#     actually shipped -- a failed or cancelled deploy leaves the previous,
#     already-synced state in place, so there is nothing new to sync against
#     and this skips.
#   - on its own weekly schedule, so the roster/fixtures/headshots stay
#     current even on a week nothing in this repo changes. Mondays 5am UTC,
#     the same cadence the removed Cloudflare cron used to run this on.
#
# Needs the same "sb" GitHub environment secrets deploy.yml already uses to
# apply D1 migrations (CLOUDFLARE_API_TOKEN, CLOUDFLARE_ACCOUNT_ID) -- no
# separate credential of its own. The D1 database id comes straight out of
# wrangler.jsonc's own d1_databases entry.

on:
  workflow_run:
    workflows: ["Deploy"]
    types: [completed]
    branches: [main]
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # One sync at a time; never cancel one already in flight -- a half-run
  # sync would otherwise leave the diff-and-write logic in sync.py part
  # applied.
  group: sync-roster
  cancel-in-progress: false

jobs:
  sync:
    name: Run roster sync
    runs-on: ubuntu-latest
    if: >-
      github.event_name != 'workflow_run'
      || github.event.workflow_run.conclusion == 'success'
    environment: sb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Run the sync
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/run_sync.py

      - name: Export opponent data to data.py
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: python3 scripts/export_opponents_data.py

      - name: Rebuild static HTML
        run: python3 web/build_src/build.py

      - name: Commit and push updated data
        run: |
          git config user.name "Sync Bot"
          git config user.email "noreply@anthropic.com"
          if [[ $(git status -s) ]]; then
            git add web/build_src/data.py web/index.html
            git commit -m "Update opponent rosters from sync"
            git push
          fi

name: Deploy

# Deploys to Cloudflare through the "sb" GitHub environment, which holds
# CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID.
#
# Neither the API nor the site is on main yet, so the detect job below finds
# nothing and every deploying job skips. Each one switches itself on when the
# thing it deploys lands.
#
# The API token deliberately has no zone or DNS permission — the custom domain
# is a CNAME managed outside this repository — so nothing here touches DNS.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: What to deploy
        required: false
        default: all
        type: choice
        options: [all, api, web]

permissions:
  contents: read

concurrency:
  # One deploy at a time, and never cancel one that is already in flight.
  group: deploy-sb
  cancel-in-progress: false

jobs:
  detect:
    name: Detect deployables
    runs-on: ubuntu-latest
    outputs:
      worker-dir: ${{ steps.detect.outputs.worker-dir }}
      static-dir: ${{ steps.detect.outputs.static-dir }}
      d1-database: ${{ steps.detect.outputs.d1-database }}
      has-migrations: ${{ steps.detect.outputs.has-migrations }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: detect
        shell: bash
        env:
          # Set this repository variable if the site lives somewhere else.
          STATIC_OVERRIDE: ${{ vars.CF_PAGES_DIRECTORY }}
          # Set this if the D1 database is not named in the wrangler config.
          D1_OVERRIDE: ${{ vars.CF_D1_DATABASE }}
        run: |
          set -euo pipefail

          # The Worker is wherever the wrangler config is.
          config="$(find . -path ./.git -prune -o -type f \
            \( -name 'wrangler.toml' -o -name 'wrangler.json' -o -name 'wrangler.jsonc' \) \
            -print -quit 2>/dev/null || true)"

          worker_dir=""
          if [ -n "$config" ]; then
            worker_dir="$(dirname "$config")"
          fi
          echo "worker-dir=$worker_dir" >> "$GITHUB_OUTPUT"

          # D1 database name, for applying migrations. Read it out of the
          # wrangler config rather than hardcoding it, so renaming the database
          # in one place is enough. wrangler supports wrangler.toml as well as
          # wrangler.json/wrangler.jsonc (JSON with // and /* */ comments
          # allowed), so parse whichever format is present.
          database="${D1_OVERRIDE:-}"
          if [ -z "$database" ] && [ -n "$config" ]; then
            database="$(python3 - "$config" <<'PY' || true
          import json, re, sys, tomllib

          path = sys.argv[1]
          try:
              if path.endswith(".toml"):
                  with open(path, "rb") as fh:
                      cfg = tomllib.load(fh)
              else:
                  with open(path, "r", encoding="utf-8") as fh:
                      text = fh.read()
                  # Strip // line comments and /* */ block comments so the
                  # jsonc wrangler.jsonc format parses as plain JSON.
                  text = re.sub(r"/\*.*?\*/", "", text, flags=re.DOTALL)
                  text = re.sub(r"(?m)^\s*//.*$", "", text)
                  cfg = json.loads(text)
          except Exception:
              raise SystemExit(0)
          dbs = cfg.get("d1_databases") or []
          if dbs:
              print(dbs[0].get("database_name", ""))
          PY
          )"
          fi
          echo "d1-database=$database" >> "$GITHUB_OUTPUT"

          has_migrations=false
          if [ -n "$worker_dir" ] && [ -d "$worker_dir/migrations" ] \
            && find "$worker_dir/migrations" -name '*.sql' -print -quit | grep -q .; then
            has_migrations=true
          fi
          echo "has-migrations=$has_migrations" >> "$GITHUB_OUTPUT"

          # The Pages site is the directory holding index.html.
          static_dir=""
          for dir in ${STATIC_OVERRIDE:-} web frontend frontend/public public dist site; do
            if [ -f "$dir/index.html" ]; then
              static_dir="$dir"
              break
            fi
          done
          echo "static-dir=$static_dir" >> "$GITHUB_OUTPUT"

          {
            echo "| What | Found |"
            echo "| --- | --- |"
            echo "| Worker | ${worker_dir:-not present} |"
            echo "| D1 database | ${database:-not configured} |"
            echo "| Migrations | $has_migrations |"
            echo "| Pages site | ${static_dir:-not present} |"
          } >> "$GITHUB_STEP_SUMMARY"

  api:
    name: Deploy API
    needs: detect
    if: >-
      needs.detect.outputs.worker-dir != ''
      && (github.event_name != 'workflow_dispatch' || inputs.target != 'web')
    runs-on: ubuntu-latest
    environment: sb
    # The `secrets` context isn't available in a step's `if:` (only at
    # workflow/job level), so whether CF_SYNC_ADMIN_TOKEN is set gets
    # resolved into this job-level env var instead, which step `if:`s can
    # read.
    env:
      HAS_SYNC_ADMIN_TOKEN: ${{ secrets.CF_SYNC_ADMIN_TOKEN != '' }}
      HAS_SITE_PWD: ${{ secrets.SITE_PWD != '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # Migrations run before the Worker that depends on them.
      - name: Apply D1 migrations
        if: needs.detect.outputs.has-migrations == 'true' && needs.detect.outputs.d1-database != ''
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ needs.detect.outputs.worker-dir }}
          wranglerVersion: '4.135.0'
          command: d1 migrations apply ${{ needs.detect.outputs.d1-database }} --remote

      - name: Warn when migrations cannot be applied
        if: needs.detect.outputs.has-migrations == 'true' && needs.detect.outputs.d1-database == ''
        run: |
          echo "::warning::Migrations exist but no D1 database name was found in the wrangler config. Set the CF_D1_DATABASE repository variable, or name the database in wrangler.toml. Skipping migrations rather than guessing."

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ needs.detect.outputs.worker-dir }}
          wranglerVersion: '4.135.0'
          command: deploy

      # Pushes the CF_SYNC_ADMIN_TOKEN GitHub secret to the Worker as its
      # SYNC_ADMIN_TOKEN secret, so nothing here ever needs `wrangler secret
      # put` run by hand -- set CF_SYNC_ADMIN_TOKEN once (any random string)
      # in this "sb" environment and the next deploy carries it over.
      # Skipped, not failed, until that secret exists, so a repo that
      # hasn't set it up yet still deploys; POST /api/admin/sync
      # (src/handlers.trigger_sync) refuses every call in the meantime.
      - name: Set SYNC_ADMIN_TOKEN secret
        if: env.HAS_SYNC_ADMIN_TOKEN == 'true'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ needs.detect.outputs.worker-dir }}
          wranglerVersion: '4.135.0'
          secrets: |
            SYNC_ADMIN_TOKEN
        env:
          SYNC_ADMIN_TOKEN: ${{ secrets.CF_SYNC_ADMIN_TOKEN }}

      # Pushes the SITE_PWD GitHub secret to the Worker as its own SITE_PWD
      # secret -- the one shared password every guest slot on the landing
      # screen signs in with (src/auth.verify_site_password). Skipped, not
      # failed, until that secret exists, so a repo that hasn't set it up
      # yet still deploys; POST /api/auth/session refuses every call in the
      # meantime (503).
      - name: Set SITE_PWD secret
        if: env.HAS_SITE_PWD == 'true'
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: ${{ needs.detect.outputs.worker-dir }}
          wranglerVersion: '4.135.0'
          secrets: |
            SITE_PWD
        env:
          SITE_PWD: ${{ secrets.SITE_PWD }}

  web:
    name: Deploy site
    # Deliberately after the API: the site calls it, so the API should be the
    # newer of the two if a deploy only half succeeds.
    needs: [detect, api]
    if: >-
      always()
      && needs.detect.result == 'success'
      && needs.detect.outputs.static-dir != ''
      && needs.api.result != 'failure'
      && needs.api.result != 'cancelled'
      && (github.event_name != 'workflow_dispatch' || inputs.target != 'api')
    runs-on: ubuntu-latest
    environment: sb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22'

      # Renamed from summit-hearth-and-bench for the Summit Basecamp rebrand.
      # A CF_PAGES_PROJECT repository variable set to the old name overrides
      # this new default -- update or unset it, or every deploy keeps
      # targeting the old (soon to be deleted) project.
      - name: Deploy to Pages
        uses: cloudflare/wrangler-action@ebbaa1584979971c8614a24965b4405ff95890e0 # v4.0.0
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: '4.135.0'
          command: >-
            pages deploy ${{ needs.detect.outputs.static-dir }}
            --project-name=${{ vars.CF_PAGES_PROJECT || 'summit-basecamp' }}
            --branch=main

  deploy:
    name: Deploy
    # Single stable check, green when there was nothing to deploy.
    needs: [detect, api, web]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Collect results
        shell: bash
        run: |
          set -euo pipefail
          fail=0
          for result in \
            "detect=${{ needs.detect.result }}" \
            "api=${{ needs.api.result }}" \
            "web=${{ needs.web.result }}"
          do
            name="${result%%=*}"
            state="${result#*=}"
            echo "- $name: $state" >> "$GITHUB_STEP_SUMMARY"
            case "$state" in
              success|skipped) ;;
              *) fail=1 ;;
            esac
          done
          exit "$fail"
